<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | MSIT Delhi</title>
    <meta name="description"
        content="The page you are looking for at Maharaja Surajmal Institute of Technology could not be found. Return to our homepage to browse campus details.">
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-bg: #0b0f19;
            --color-slate-900: #0f172a;
            --color-slate-800: #1e293b;
            --color-slate-400: #94a3b8;
            --color-primary: #3b82f6;
            --color-accent: #f97316;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-serif: 'Libre Baskerville', Georgia, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Abstract glowing backgrounds */
        .glow-1 {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.04);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-2 {
            position: absolute;
            bottom: 20%;
            right: 20%;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.03);
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            position: relative;
        }

        .logo-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .logo-link:hover {
            border-color: rgba(59, 130, 246, 0.3);
            background: rgba(59, 130, 246, 0.05);
        }

        .logo-img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 6px;
        }

        .logo-text {
            color: #cbd5e1;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .error-code {
            font-family: var(--font-serif);
            font-size: 96px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f8fafc 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        h2 {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--color-slate-400);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 14px 28px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.05);
        }

        .btn-home:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-home:active {
            transform: translateY(0);
        }

        .footer-tag {
            margin-top: 30px;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
    </style>
</head>

<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="container">
        <a href="/" class="logo-link">
            <img src="/msit-logo.webp" alt="MSIT Logo" class="logo-img">
            <span class="logo-text">MSIT Delhi</span>
        </a>
        <div class="error-code">404</div>
        <h2>Page Not Found</h2>
        <p>Sorry, the page you're searching for at Maharaja Surajmal Institute of Technology doesn't exist or has been
            moved.</p>
        <a href="/" class="btn-home">Back to Home</a>
        <div class="footer-tag">HTTP_404_NOT_FOUND</div>
    </div>
</body>

</html>
